<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prun Bienes Raíces</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --black:#111; --yellow:#F4C300; --cream:#F7F5F0; --gray:#6b6b66; --line:#e4e1d8; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Archivo',sans-serif;}
h1,h2,h3{font-family:'Archivo Black';text-transform:uppercase;}
body{background:var(--cream);color:var(--black);}
a{color:inherit;text-decoration:none;}
.container{max-width:1200px;margin:0 auto;padding:0 24px;}
.btn{display:inline-block;padding:13px 24px;font-weight:800;font-size:13px;text-transform:uppercase;border:2px solid var(--black);background:var(--black);color:#fff;border-radius:2px;}
.btn:hover{background:var(--yellow);color:var(--black);border-color:var(--yellow);}
nav{position:fixed;top:0;left:0;right:0;background:var(--black);border-bottom:3px solid var(--yellow);z-index:100;}
.nav-inner{display:flex;justify-content:space-between;align-items:center;height:72px;}
.logo{color:#fff;font-family:'Archivo Black';font-size:20px;}
.logo span{color:var(--yellow);}
#hero{background:var(--black);color:#fff;padding:150px 0 60px;border-bottom:6px solid var(--yellow);}
.hero-title{font-size:44px;line-height:1;margin-bottom:16px;}
.hero-title em{color:var(--yellow);font-style:normal;}
section{padding:70px 0;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.card{background:#fff;border:1.5px solid var(--line);}
.card-photo{height:190px;background:#222;display:flex;align-items:center;justify-content:center;color:#665;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:18px;}
.price{font-family:'Archivo Black';font-size:20px;}
.msg{font-size:12px;padding:9px 11px;margin-bottom:12px;display:none;}
.msg.error{background:#fdeaea;color:#b33;display:block;}
.msg.success{background:#eafaf0;color:#1a7a44;display:block;}
input,select,textarea{padding:11px 13px;border:1.5px solid var(--line);width:100%;font-family:inherit;}
footer{background:var(--black);color:#8a8880;padding:24px 0;text-align:center;font-size:12px;}
@media(max-width:800px){.grid{grid-template-columns:1fr;}.hero-title{font-size:32px;}}
</style>
</head>
<body>
<nav><div class="container nav-inner">
  <a href="#" class="logo">PRUN<span>.</span></a>
  <div><a href="admin.html" style="color:#fff;font-size:13px;font-weight:700;text-transform:uppercase">Panel admin →</a></div>
</div></nav>

<section id="hero">
  <div class="container">
    <h1 class="hero-title">Encontrá tu próximo <em>lugar</em></h1>
    <p style="color:#c8c6bd;max-width:480px">Esta es la versión conectada a la nube — cada propiedad que cargues desde el panel ya queda visible acá para cualquiera, desde cualquier lugar.</p>
  </div>
</section>

<section>
  <div class="container">
    <h2 style="margin-bottom:24px">Propiedades</h2>
    <div class="grid" id="grid"><p style="color:var(--gray)">Cargando...</p></div>
  </div>
</section>

<section style="background:#fff;border-top:1.5px solid var(--line)">
  <div class="container" style="max-width:520px">
    <h2 style="margin-bottom:20px">Contacto</h2>
    <div class="msg" id="contact-msg"></div>
    <form id="contact-form" onsubmit="return submitContact(event)" style="display:flex;flex-direction:column;gap:12px">
      <input type="text" name="name" placeholder="Nombre" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Mensaje" rows="4" required></textarea>
      <button class="btn" type="submit">Enviar</button>
    </form>
  </div>
</section>

<footer>© 2026 Prun Bienes Raíces — versión en la nube</footer>

<script>
const API = window.location.origin + '/api';

async function loadProperties(){
  const grid = document.getElementById('grid');
  try{
    const res = await fetch(`${API}/properties`);
    const data = await res.json();
    if(!data.length){ grid.innerHTML = '<p style="color:var(--gray)">Todavía no hay propiedades cargadas. Entrá al panel de administración para agregar la primera.</p>'; return; }
    grid.innerHTML = data.map(p => `
      <div class="card">
        <div class="card-photo">${p.photos && p.photos[0] ? `<img src="${p.photos[0]}">` : 'Sin foto'}</div>
        <div class="card-body">
          <div class="price">${p.currency} ${Number(p.price).toLocaleString('es-AR')}</div>
          <div style="font-weight:700;margin:4px 0">${p.title}</div>
          <div style="color:var(--gray);font-size:13px">${p.city||''}</div>
        </div>
      </div>
    `).join('');
  }catch(err){
    grid.innerHTML = '<p style="color:var(--gray)">No pudimos conectar con el servidor. Revisá que el backend esté funcionando en Render.</p>';
  }
}
async function submitContact(e){
  e.preventDefault();
  const form = e.target;
  const body = Object.fromEntries(new FormData(form).entries());
  try{
    const res = await fetch(`${API}/inquiries`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if(!res.ok) throw new Error();
    document.getElementById('contact-msg').textContent = '¡Mensaje enviado!';
    document.getElementById('contact-msg').className = 'msg success';
    form.reset();
  }catch(err){
    document.getElementById('contact-msg').textContent = 'No pudimos enviar tu mensaje.';
    document.getElementById('contact-msg').className = 'msg error';
  }
  return false;
}
loadProperties();
</script>
</body>
</html>
